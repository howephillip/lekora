name: Lekora
options:
  bundleIdPrefix: app.lekora
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
targets:
  Lekora:
    type: application
    platform: iOS
    sources: [Lekora]
    info:
      path: Lekora/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.lekora.pair
            CFBundleURLSchemes: [lekora-pair]
        NSCameraUsageDescription: Lekora uses the camera only to scan the pairing QR code shown on your Hermes computer.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: Lekora
        PRODUCT_BUNDLE_IDENTIFIER: app.lekora.Lekora
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4PV6H53QBH
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  LekoraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LekoraTests]
    dependencies:
      - target: Lekora
    settings:
      base:
        PRODUCT_NAME: LekoraTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lekora.app/Lekora"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: app.lekora.LekoraTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lekora:
    build:
      targets:
        Lekora: all
        LekoraTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LekoraTests]
